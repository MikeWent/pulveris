[project]
name = "pulveris"
version = "0.1.0"
description = "Camera-guided PID line follower for NanoPi NEO"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8,<5; platform_machine != 'armv7l'",
    "gpiod>=2.1,<3; sys_platform == 'linux' and platform_machine == 'armv7l'",
]
